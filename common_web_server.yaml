# Configures the web server and enables OTA uploads
# Don't include if the device has limited resources

ota:
  - id: ota_web_server
    platform: web_server # Enables web-based OTA uploads

web_server:
  port: 80
  version: 3
  auth:
    type: digest # this line becomes default after 2027.1 and can be removed then
    username: !secret web_server_username
    password: !secret web_server_password
