esphome:
  name: ${name}
  friendly_name: ${area} ${friendly_name}
  name_add_mac_suffix: false
  area: ${area}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: !secret wifi_domain
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${name} Fallback Hotspot"
    password: !secret fallback_hotspot_password

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# Don't enable OTA referencing secrets.yaml until you change the password manually for each device
# See https://esphome.io/components/ota/esphome.html#updating-the-password
ota:
#  - platform: esphome
#    password: !secret ota_password
  - platform: web_server  # Enables web-based OTA uploads

captive_portal:

time:
  - id: !extend sntp_time
    servers: time.cloudflare.com

# Don't include if the device has limited resources
# Remove by appending `!remove` to the web_server line
web_server:
  port: 80
  version: 3
  auth: 
    username: !secret web_server_username
    password: !secret web_server_password
